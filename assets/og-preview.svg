<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="h1" cx="22%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF0844" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF0844" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h2" cx="78%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="58%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDDDDD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D1A"/>

  <!-- Ambient halos -->
  <ellipse cx="265" cy="315" rx="380" ry="300" fill="url(#h1)"/>
  <ellipse cx="940" cy="315" rx="300" ry="240" fill="url(#h2)"/>

  <!-- Border accent -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#flame)"/>

  <!-- Flame icon -->
  <g transform="translate(88, 148) scale(4.2)" filter="url(#glow)">
    <path d="M28 76 C20 60 36 50 28 30 C40 42 46 58 40 70 C46 58 44 42 36 28 C50 38 60 58 52 74 C56 78 50 80 40 80 C28 80 24 78 28 76Z" fill="url(#flame)"/>
  </g>

  <!-- App name -->
  <text x="365" y="285" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="96" font-weight="900" fill="white" letter-spacing="-3">DupeFire</text>

  <!-- Tagline -->
  <text x="365" y="355" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="32" font-weight="400" fill="#AAAAAA" letter-spacing="-0.5">Quema tus duplicados. Recupera tu espacio.</text>

  <!-- Chips row -->
  <rect x="365" y="395" width="196" height="44" rx="22" fill="rgba(255,107,53,0.14)" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="463" y="422" font-family="system-ui,-apple-system,sans-serif" font-size="17" font-weight="600" fill="#FF8C60" text-anchor="middle">Android · Gratis</text>

  <rect x="576" y="395" width="172" height="44" rx="22" fill="rgba(0,200,150,0.12)" stroke="#00C896" stroke-width="1.5"/>
  <text x="662" y="422" font-family="system-ui,-apple-system,sans-serif" font-size="17" font-weight="600" fill="#00C896" text-anchor="middle">100% Local</text>

  <rect x="763" y="395" width="172" height="44" rx="22" fill="rgba(255,215,0,0.1)" stroke="#FFD700" stroke-width="1.5"/>
  <text x="849" y="422" font-family="system-ui,-apple-system,sans-serif" font-size="17" font-weight="600" fill="#FFD700" text-anchor="middle">Sin registro</text>

  <!-- Google Play CTA -->
  <rect x="365" y="470" width="244" height="58" rx="29" fill="#FF0844"/>
  <text x="487" y="505" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">Descargar en Google Play</text>

  <!-- Bottom caption -->
  <text x="600" y="590" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="400" fill="#555577" text-anchor="middle" letter-spacing="0.3">neoacid-dbl.github.io/DupeFire</text>
</svg>
